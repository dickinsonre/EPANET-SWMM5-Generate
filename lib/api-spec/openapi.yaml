openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: anthropic
    description: AI assistant operations
paths:
  /anthropic/summarize:
    post:
      operationId: summarizeNetwork
      tags: [anthropic]
      summary: Summarize the generated network
      description: >-
        Sends a structured snapshot of the most recently generated network to
        Claude and returns a plain-language summary. Optionally answers a
        free-form follow-up question about the same network.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NetworkSummaryRequest"
      responses:
        "200":
          description: Generated summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkSummaryResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many requests (rate limited)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Upstream AI provider error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    NetworkSummaryRequest:
      type: object
      properties:
        networkContext:
          type: string
          description: Structured snapshot of the last generated network (mode, units, stats, config, seed).
          minLength: 1
          maxLength: 20000
        question:
          type: string
          description: Optional free-form follow-up question about the network.
          maxLength: 2000
      required:
        - networkContext
    NetworkSummaryResult:
      type: object
      properties:
        summary:
          type: string
        model:
          type: string
      required:
        - summary
        - model
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

